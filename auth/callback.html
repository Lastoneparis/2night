<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Signing you in…</title>
  <meta name="theme-color" content="#0B0A0D" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-itunes-app" content="app-id=6780563413" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <script src="/js/config.js?v=20260814a"></script>
  <style>
    :root { --base:#0B0A0D; --ink:#ECE7E0; --ink-2:#A8A29B; --gold-ink:#F7D372; --control-border:#757090; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { background:var(--base); color:var(--ink); display:flex; align-items:center; justify-content:center;
           text-align:center; padding:32px 22px;
           font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif; }
    .wrap { display:flex; flex-direction:column; align-items:center; gap:18px; max-width:34ch; }
    img { width:72px; height:72px; border-radius:18px; box-shadow:0 0 0 1px var(--control-border); }
    h1 { font-size:22px; font-weight:700; letter-spacing:-.01em; }
    p { color:var(--ink-2); font-size:15px; line-height:1.6; }
    a { color:var(--gold-ink); text-decoration:underline; text-underline-offset:3px; }
    .sp { width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.22);
          border-top-color:var(--gold-ink); animation:s .7s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .sp { animation:none; } }
  </style>
</head>
<body>
  <!-- WHY THIS FILE EXISTS
       js/app-handoff.js sets Supabase's emailRedirectTo to
       https://2night.co/auth/callback?platform=ios, and the path is declared in
       apple-app-site-association. The intent is that iOS intercepts the link
       from the email and opens the app already signed in.

       The app does not yet carry the associated-domains entitlement, so iOS
       never intercepts it. Until this file existed, every magic-link email sent
       through that path landed the user on a 404 — a broken sign-in, not a
       cosmetic gap.

       The web fallback forwards to /account, which already contains the
       Supabase session logic. Both the query string AND the hash fragment are
       carried over: Supabase returns the session in the fragment
       (#access_token=…), and dropping it would silently destroy the sign-in. -->
  <div class="wrap">
    <img src="/assets/icon.png" width="256" height="256" alt="2NIGHT" />
    <div class="sp" aria-hidden="true"></div>
    <h1>Signing you in…</h1>
    <p>If this takes more than a moment, <a href="/account" id="fallback">open your account</a>.</p>
  </div>
  <script>
    (function () {
      // location.hash carries the Supabase tokens. It MUST survive this hop.
      var target = "/account" + (window.location.search || "") + (window.location.hash || "");
      var link = document.getElementById("fallback");
      if (link) link.setAttribute("href", target);
      setTimeout(function () {
        if (!document.hidden) window.location.replace(target);
      }, 600);
    })();
  </script>
</body>
</html>
