<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 577 721" width="577" height="721" role="img" aria-label="2NIGHT — two paths converging under a crescent moon above a city skyline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="0.55" stop-color="#0c0c10"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#B8860B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A0"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD700" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="577" height="721" fill="url(#bg)"/>
  <rect width="577" height="721" fill="url(#glow)"/>

  <!-- crescent moon -->
  <g transform="translate(288.5 188)">
    <circle r="58" fill="#FFD700" opacity="0.10" filter="url(#soft)"/>
    <path d="M 30 -50 A 58 58 0 1 0 30 50 A 44 44 0 1 1 30 -50 Z"
          fill="url(#goldStroke)"/>
  </g>

  <!-- stars -->
  <g fill="#FFF0A0">
    <circle cx="120" cy="120" r="2.2" opacity="0.8"/>
    <circle cx="455" cy="96" r="1.8" opacity="0.7"/>
    <circle cx="408" cy="210" r="1.5" opacity="0.6"/>
    <circle cx="172" cy="248" r="1.6" opacity="0.55"/>
    <circle cx="492" cy="270" r="2.0" opacity="0.65"/>
    <circle cx="86" cy="300" r="1.4" opacity="0.5"/>
  </g>

  <!-- two converging paths: "two friends, one idea" -->
  <g fill="none" stroke-linecap="round">
    <path d="M 70 540 C 150 430, 230 380, 288.5 320"
          stroke="url(#goldStroke)" stroke-width="3" opacity="0.95"/>
    <path d="M 507 540 C 427 430, 347 380, 288.5 320"
          stroke="url(#goldStroke)" stroke-width="3" opacity="0.95"/>
    <!-- glow under the lines -->
    <path d="M 70 540 C 150 430, 230 380, 288.5 320"
          stroke="#FFD700" stroke-width="9" opacity="0.12" filter="url(#soft)"/>
    <path d="M 507 540 C 427 430, 347 380, 288.5 320"
          stroke="#FFD700" stroke-width="9" opacity="0.12" filter="url(#soft)"/>
  </g>
  <!-- convergence node -->
  <circle cx="288.5" cy="320" r="7" fill="#FFD700"/>
  <circle cx="288.5" cy="320" r="16" fill="#FFD700" opacity="0.18" filter="url(#soft)"/>

  <!-- path origin dots -->
  <circle cx="70" cy="540" r="5.5" fill="url(#goldStroke)"/>
  <circle cx="507" cy="540" r="5.5" fill="url(#goldStroke)"/>

  <!-- skyline silhouette -->
  <rect x="0" y="610" width="577" height="111" fill="url(#skyline)"/>
  <g fill="#0a0a0c" stroke="#FFD700" stroke-opacity="0.22" stroke-width="1">
    <rect x="36"  y="612" width="42" height="109"/>
    <rect x="86"  y="566" width="34" height="155"/>
    <rect x="128" y="598" width="46" height="123"/>
    <rect x="182" y="548" width="30" height="173"/>
    <rect x="220" y="600" width="50" height="121"/>
    <rect x="278" y="572" width="36" height="149"/>
    <rect x="322" y="606" width="44" height="115"/>
    <rect x="374" y="558" width="32" height="163"/>
    <rect x="414" y="596" width="48" height="125"/>
    <rect x="470" y="580" width="34" height="141"/>
    <rect x="512" y="610" width="40" height="111"/>
  </g>
  <!-- lit windows -->
  <g fill="#FFD700" opacity="0.55">
    <rect x="96"  y="582" width="5" height="6"/>
    <rect x="106" y="600" width="5" height="6"/>
    <rect x="192" y="566" width="5" height="6"/>
    <rect x="192" y="588" width="5" height="6"/>
    <rect x="288" y="590" width="5" height="6"/>
    <rect x="384" y="576" width="5" height="6"/>
    <rect x="384" y="598" width="5" height="6"/>
    <rect x="480" y="598" width="5" height="6"/>
  </g>
</svg>
